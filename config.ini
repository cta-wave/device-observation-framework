[GENERAL]
# URL to access Test Runner API
test_runner_url = http://localhost:8000/_wave/
# input filenames in a folder can be sorted either by "filename" or by "timestamp"
sort_input_files_by = filename
# sub-directory for log files, relative to observation_platform directory
log_file_path = logs
# sub-directory for results files, relative to observation_platform directory
result_file_path = results
# sub-directory for audio mezzanine files, relative to observation_platform directory
audio_mezzanine_file_path = audio_mezzanine
# max number of session logs and session results
# older logs and results gets deleted when max number of session is exceeded
session_log_threshold = 100
# If the number of missing frames on an individual test is greater than this
# then posts an error result and terminates the session.
# Set to 0 to disable the feature.
missing_frame_threshold = 0
# If number of consecutive camera frames has no qr code
# then posts an error result and terminates the session.
# This value is in number of mezzanine frames
# corespondent camera framecan be calculated by
# camera_frame_rate/mezzanine_frame_rate * consecutive_no_qr_threshold
# Set to 0 to disable the feature.
consecutive_no_qr_threshold = 0
# session timeout from receiving the status ended QR code
end_of_session_timeout = 600
# check for no QR code is detected
# if timeout is exceeded then session is ended and observation framework terminates
no_qr_code_timeout = 5
# serach qr area in seconds, where the search end to
# 0 to disable search
search_qr_area_to = 60
# margin to add around the detected area to crop
qr_area_margin = 50
# qr code list check back count for duplicated qr code detection
duplicated_qr_check_count = 3
# number of worker threads used for the QR code full scan
# frames are read and processed in recording order regardless of this value,
# only the scan itself is shared across threads
# scanning a 1080p frame costs around 46ms against 3.8ms to read it, so the
# scan is CPU bound and the useful maximum is the physical core count
# this is not detected, set it for the machine: what counts is the cores the
# Observation Framework actually gets, which in a container is what --cpus or
# --cpuset-cpus allows and not what the host reports
# leave room for whatever shares the machine, such as a Test Runner in another
# container
# two frames per thread are held in memory until the batch is drained,
# roughly 6MB each at 1080p and 25MB at 4K
# long duration playback tests skip between their detection windows instead,
# scanning one frame at a time while they do, so they gain little from this;
# turning off periodic detection in [LONGDURATION] makes them a full scan
# again, and they are then threaded like any other test
# set to 0 or 1 to disable threading and scan frames sequentially
# --qr_scan_thread_count overrides this value for a single run
qr_scan_thread_count = 8
# audio_alignment_tolerance in milliseconds 
# The time difference between two adjacent samples should not exceed this threshold.
audio_alignment_tolerance = 4
# only check in the expected neighborhood of the segment to speed up the calculation
# 500ms sample is taken from the recording file on expected position
# instead of finding matches with whole recording file
audio_observation_neighborhood = 500
# Align the archived copy of PN data (segmentdata) with the PN data in the recorded audio (subjectdata)
# loop audio_alignment_check_count times to check from start and end of segment
# if last 3 segments are aligned within the tolerance of segment duration.
audio_alignment_check_count = 100
# amount of qr codes to look forwards and backwards around switching point
# for no visible video shifts
max_search_frames_for_video_shift = 25
# if a full scan misses a qr code expected in the frame, also scan the middle half of
# the image's width on its own, where the pre-test qr code is expected
# runs on any frame scanned in full, adding processing time to each
# only use when OF is unable to detect the pre-test qr code
# True = Enabled, False = Disabled
enable_cropped_scan_for_pre_test_qr = False
# between tests, scan only where the pre-test qr code is drawn instead of the full frame
# starts once a pre-test qr code is found in the middle half of the image's width, and
# stops for the rest of the recording if one is later found outside that area
# once the next pre-test qr code is read, a frame with nothing in the area is scanned
# in full, until the next test starts
# True = Enabled, False = Disabled
enable_reduced_scan_between_tests = True
# seconds (whole numbers) to wait for a pre-test qr code before scanning the gap in full,
# counted from the test reporting finished: must outlast the device reaching the pre-test
# screen and end before that screen leaves, so a missed code is still there for the full scan
reduced_scan_between_tests_timeout = 8
# margin around the pre-test qr code's area, as a percentage of its width/height per side
# the area is fitted once, to the first code; too small and a code that drifts between
# tests falls outside it, stopping the reduced scan for the rest of the recording
# too large gives up more of the saving than the drift needs
reduced_scan_between_tests_margin = 50


# Long Duration Playback Test Configuration
[LONGDURATION]

# Time from start of playback to begin mid-test checks
starting_check_duration = 30
# Duration in the middle of playback for periodic checks
mid_check_duration = 30 
# Time before end of playback to perform final checks
ending_check_duration = 30

# Interval at which QR detection is performed (in seconds)
# This is configurable depending on desired frequency
# Set it 0 to disable PeriodicQrDetection
# e.g., 600 seconds = every 10 minutes
check_interval_seconds = 600


[TOLERANCES]
# video tolerances in counts
start_frame_num_tolerance = 1
end_frame_num_tolerance = 0
mid_frame_num_tolerance = 10
splice_start_frame_num_tolerance = 0
splice_end_frame_num_tolerance = 0
# audio tolerances in counts
start_segment_num_tolerance = 4
end_segment_num_tolerance = 4
mid_segment_num_tolerance = 10
splice_start_segment_num_tolerance = 0
splice_end_segment_num_tolerance = 0
# audio video tolerances
earliest_sample_alignment_tolerance = 80
av_sync_start_tolerance = 1000
av_sync_end_tolerance = 1000
av_sync_pass_rate = 95

[CALIBRATION]
# number of flash and beep pair in the recording file
flash_and_beep_count = 60
# max allowed av sync offset in ms
max_allowed_offset = 200
# allowed av sync offset in ms
allowed_offset = 40
# Flash threshold (adjust if need)
flash_threshold = 150
# x_ratio, y_ratio: Ratios of the coordinates (0 to 1) to monitor.
x_ratio = 0.5
y_ratio = 0.25
# Size of the area (window) around the (x, y) pixel to monitor.
window_size = 50
# Number of frames to wait after a flash before allowing another flash detection.
fade_out_frames = 5
# audio beep threshold (adjust if need)
beep_threshold = 0.3
# audio min silence duration
min_silence_duration = 0.9
